[project]
name = "scoutradar-backend"
version = "2.0.0"
description = "ScoutRadar API - FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.0.0",
    "email-validator>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyarrow>=14.0.0",
    "rapidfuzz>=3.5.0",
    "scikit-learn>=1.3.0",
    "umap-learn>=0.5.5",
    "hdbscan>=0.8.33",
    "openai>=1.12.0",
    "requests>=2.28.0",
    "soccerdata>=1.8.0",
    "lxml>=4.9.0",
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=3.2.0,<4.1",
    "python-jose[cryptography]>=3.3.0",
    "resend>=2.0.0",
    "boto3>=1.35.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "httpx>=0.27.0"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
